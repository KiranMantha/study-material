<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pages Index</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1d1f23;
    --muted: #5d636d;
    --line: #d7dade;
    --accent: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171b;
      --card: #1e2127;
      --ink: #e8eaed;
      --muted: #9aa1ab;
      --line: #343a44;
      --accent: #6b9bff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171b;
    --card: #1e2127;
    --ink: #e8eaed;
    --muted: #9aa1ab;
    --line: #343a44;
    --accent: #6b9bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 18px 80px; }
  h1 { font-size: 2rem; margin: 0 0 6px; }
  .intro { color: var(--muted); margin: 0 0 28px; }
  ul.pages { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
  ul.pages li a {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s;
  }
  ul.pages li a:hover, ul.pages li a:focus-visible { border-color: var(--accent); outline: none; }
  ul.pages .title { display: block; font-size: 1.1rem; font-weight: 600; color: var(--accent); }
  ul.pages .desc { display: block; color: var(--muted); font-size: 0.95rem; margin-top: 4px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>Pages</h1>
  <p class="intro">Choose a page to open it.</p>

  <ul class="pages">
    <!-- Add one <li> per page. Link with the file name, relative to this index. -->
    <li>
      <a href="system-design-guide.html">
        <span class="title">System Design: Visual Guide</span>
        <span class="desc">Patterns, examples and tools, each with an animated diagram and a CAP view for the four examples.</span>
      </a>
    </li>
  </ul>

  <footer>Last updated 2026-10-27.</footer>
</main>
</body>
</html>
